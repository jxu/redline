<!doctype html>
<meta charset="utf-8">
<title>Redline browser benchmark</title>
<script type="module">
import { decodeAudio } from "../audio-decoder.js";
import { detectBeats } from "../analysis-worker-client.js";
window.analyzeAudio = async (url, backend) => {
    const response = await fetch(url);
    if (!response.ok) throw new Error(`Audio fetch failed: ${response.status}`);
    const context = new AudioContext();
    try {
        const decoded = await decodeAudio(await response.arrayBuffer(), context);
        const frames = await detectBeats(decoded.samples, { backend });
        return {
            durationMs: decoded.audioBuffer.duration * 1000,
            sourceSampleRate: decoded.audioBuffer.sampleRate,
            sampleCount: decoded.samples.length,
            probabilities: Array.from(frames.probabilities),
            downbeatProbabilities: Array.from(frames.downbeatProbabilities),
            backend: frames.backend,
            timings: frames.timings,
            userAgent: navigator.userAgent,
        };
    } finally {
        await context.close();
    }
};
window.ready = true;
</script>
