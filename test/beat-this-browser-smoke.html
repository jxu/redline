<!doctype html><meta charset="utf-8" /><title>
    Beat This worker validation
</title>
<script type="module">
    import { detectBeats } from "../analysis-worker-client.js";
    import { decodeAudio } from "../audio-decoder.js";
    import { calculateExportTiming as calculateTiming } from "../timing-export.js";
    window.ready = true;
    window.validate = async (backend, seconds = 0) => {
        const encoded = await (
            await fetch(
                "../benchmark/corpus/13012%20Silvertear%20-%20So%20Deep%20(Perfect%20Sphere%20Remix)/SO%20DEEP%20(PERFECT%20SPHERE%20REMIX).mp3",
            )
        ).arrayBuffer();
        const decoded = await decodeAudio(encoded, new AudioContext());
        const pcm = new Float32Array(
            await (
                await fetch(
                    "../benchmark/beat-this-browser/artifacts/full-audio.f32",
                )
            ).arrayBuffer(),
        );
        const samples = seconds ? pcm.slice(0, seconds * 22050) : pcm;
        const result = await detectBeats(samples, { backend });
        const timing = calculateTiming(result.ticks, {
            tempoPattern: "sections",
            probabilities: result.probabilities,
            probabilityFrameMs: result.probabilityFrameMs,
            downbeatTicks: result.downbeats,
            endTime: samples.length / 22050,
        });
        return {
            ...result,
            probabilities: Array.from(result.probabilities),
            downbeatProbabilities: Array.from(result.downbeatProbabilities),
            browserDecodedSamples: decoded.samples.length,
            pcmSamples: samples.length,
            timingPointCount: timing.timingPoints.length,
            exported: timing.osuTimingPoints,
        };
    };
</script>
